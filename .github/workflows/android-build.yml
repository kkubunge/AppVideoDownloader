name: Android Build

# 로컬에 Android 툴체인이 없어도 빌드가 되는지 확인하고 APK를 받기 위한 워크플로.
# 성공하면 Actions 실행 화면 하단 Artifacts에서 app-debug-apk 를 내려받을 수 있다.
# 실패하면 오류 로그를 ci-logs/last-build-errors.md 로 커밋해 둔다 — Actions 로그는
# 인증이 있어야 읽을 수 있어서, 저장소 파일로 남겨 두면 git pull만으로 확인할 수 있다.

# 실패 로그 커밋이 다시 빌드를 부르지 않도록, 그 커밋 메시지에 [skip ci]를 넣는다.
# (paths-ignore로 막으려 했으나 트리거 자체가 생성되지 않아 되돌렸다.)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 디버그 APK 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 러너 PATH에 sdkmanager가 없어 직접 호출은 실패한다.
      # 이 액션이 cmdline-tools 설치 · 라이선스 동의 · 패키지 설치를 한 번에 처리한다.
      - name: Android SDK 준비
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 저장소에 gradle wrapper(바이너리)가 없으므로 Gradle을 직접 준비한다.
      - name: Gradle 8.9 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: assembleDebug
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build-output.txt

      - name: APK 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 실패 원인을 저장소에 남긴다. [skip ci]로 재실행 루프를 막는다.
      - name: 실패 로그 커밋
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "# 빌드 실패 로그"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '## 컴파일 오류 (e: / FAILURE / what went wrong)'
            echo '```'
            grep -E '^(e: |w: .*[Ee]rror|FAILURE:|\* What went wrong:|Caused by:|> )' build-output.txt | head -300 || echo '(해당 패턴 없음)'
            echo '```'
            echo
            echo '## 전체 로그 끝부분 (400줄)'
            echo '```'
            tail -n 400 build-output.txt
            echo '```'
          } > ci-logs/last-build-errors.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/last-build-errors.md
          git commit -m "CI: 빌드 실패 로그 기록 [skip ci]"
          git push origin HEAD:master

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build-output.txt
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
