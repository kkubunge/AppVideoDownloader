name: Android Build

# 로컬에 Android 툴체인이 없어도 빌드가 되는지 확인하고 APK를 받기 위한 워크플로.
# 성공하면 Actions 실행 화면 하단 Artifacts에서 app-debug-apk 를 내려받을 수 있다.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: 디버그 APK 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 구성요소 설치
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # 저장소에 gradle wrapper(바이너리)가 없으므로 Gradle을 직접 준비한다.
      - name: Gradle 8.9 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: assembleDebug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: APK 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 실패했을 때 원인을 바로 보기 위한 리포트.
      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
